# Автодеплой сайта на хостинг SpaceWeb по FTP.
# Срабатывает на каждый push в main и вручную (вкладка Actions → Deploy → Run workflow).
#
# Перед первым запуском добавь секреты в репозиторий:
# Settings → Secrets and variables → Actions → New repository secret
#   FTP_SERVER    адрес FTP-сервера из панели SpaceWeb (без ftp:// и без слеша)
#   FTP_USERNAME  логин FTP
#   FTP_PASSWORD  пароль FTP
#   FTP_DIR       папка сайта на сервере, со слешем на конце,
#                 например: lizastarovoitova.ru/public_html/

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускать два деплоя одновременно: новый ждёт, старый не отменяется на середине заливки
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Залить на хостинг
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          # Шифрованное соединение. Если деплой упадёт с ошибкой TLS/SSL,
          # поменяй на: ftp
          protocol: ftps
          # Заливаются только изменённые файлы (экшен хранит их список
          # в .ftp-deploy-sync-state.json на сервере)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .gitignore
            CNAME
            README.md
            **/.DS_Store
